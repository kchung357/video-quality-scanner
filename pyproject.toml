[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vqs"
version = "2.0.0"
description = "Video Quality Scanner v2 — upscale worthiness, pair keep/delete, and decode health"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "video-quality-scanner contributors" }]
dependencies = [
  "opencv-python>=4.5,<5",
  "numpy>=1.24,<3",
  "tqdm>=4.60,<5",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.2",
  "torchvision>=0.17",
  "pyiqa>=0.1.10",
  "lpips>=0.1.4",
]
dev = [
  "pytest>=7.0",
]

[project.scripts]
vqs = "vqs.cli:main"

[tool.setuptools.packages.find]
include = ["vqs*"]

[tool.setuptools.package-data]
vqs = ["report/static/*"]
